<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Builder printables — Wallscourt Farm Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1798d3; --ink:#1d2433; --muted:#5b6475; --line:#dfe5ee;
    --who:#e8792e; --doing:#f2c94c; --what:#4caf6d; --where:#2e74c4; --when:#a35332;
    --how:#cb79bb; --describe:#a873be;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:#eef2f7;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  button,select{font-family:inherit}
  .controls{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1798d3,#0f6fa0);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .controls b{font-size:1.15rem;margin-right:6px}
  .controls label{font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:6px}
  .controls select{font-size:.95rem;padding:5px 8px;border-radius:8px;border:0;max-width:240px}
  .controls button{border:0;border-radius:10px;padding:8px 14px;font-weight:900;font-size:.95rem;cursor:pointer;background:rgba(255,255,255,.2);color:#fff}
  .controls button.primary{background:#fff;color:#0f6fa0}
  .controls .ver{margin-left:auto;font-size:.8rem;opacity:.85}
  .hint{max-width:900px;margin:12px auto 0;color:var(--muted);font-weight:700;padding:0 16px}

  .sheet{background:#fff;margin:16px auto;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:12mm;position:relative;overflow:hidden}
  .sheet.portrait{width:210mm;height:297mm}
  .sheet.landscape{width:297mm;height:210mm}
  .sheet h1{margin:0 0 4mm;font-size:22pt;font-weight:900}
  .sheet h2{margin:5mm 0 2mm;font-size:13pt;font-weight:900}
  .sheet .foot{position:absolute;bottom:6mm;left:12mm;right:12mm;font-size:8pt;color:#8a93a3;display:flex;justify-content:space-between}

  /* coloured blocks */
  .blk{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;color:#fff;font-family:'Andika',sans-serif;font-size:13pt;margin:1px}
  .blk.doing{color:#3a2c00}
  .blk.lit{background:none;color:var(--ink);padding:2px 1px}
  .blk.join{background:#fff;color:#c0392b;border:2px solid #c0392b}
  .blk.sub{background:#fff;color:#2e5fa3;border:2px solid #2e5fa3}
  .who{background:var(--who)} .doing{background:var(--doing)} .what{background:var(--what)} .where{background:var(--where)}
  .when{background:var(--when)} .how{background:var(--how)} .describe{background:var(--describe)}

  /* desk mat */
  .mat{display:grid;grid-template-columns:1.55fr 1fr;gap:8mm}
  .ladder{display:flex;flex-direction:column-reverse;gap:2.2mm}
  .rung{border:2px solid var(--line);border-radius:10px;padding:2.2mm 3mm;display:flex;align-items:center;gap:3mm}
  .rung .n{flex:0 0 13mm;height:13mm;border-radius:50%;background:var(--brand);color:#fff;font-weight:900;font-size:15pt;display:flex;align-items:center;justify-content:center}
  .rung .t{font-weight:900;font-size:11pt}
  .rung .ex{margin-top:1mm}
  .box{border:3px solid var(--brand);border-radius:12px;padding:4mm;margin-bottom:5mm}
  .box h2{margin-top:0}
  .box ul{margin:0;padding-left:5mm;font-size:11.5pt;line-height:1.5}
  .key{display:grid;grid-template-columns:1fr 1fr;gap:2mm}
  .key div{display:flex;align-items:center;gap:2mm;font-size:10pt;font-weight:800}
  .key img{height:7mm;border-radius:4px;padding:1mm}

  /* word cards */
  .wc-top{display:flex;gap:6mm;align-items:flex-start;margin-bottom:3mm}
  .wc-top img{width:85mm;border-radius:8px}
  .wc-top p{font-size:11pt;color:var(--muted);font-weight:700}
  .cards{display:flex;flex-wrap:wrap;gap:2.5mm;margin-bottom:2mm}
  .cut{border:1.5px dashed #9aa3b2;border-radius:3mm;padding:1.2mm}
  .cut .blk{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:28mm;min-height:15mm;padding:1.5mm 3mm;font-size:15pt;margin:0;border-radius:2mm}
  .cut .blk small{font-family:'Nunito',sans-serif;font-size:7pt;font-weight:900;text-transform:uppercase;opacity:.85}
  .cut .blk.punct{background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:20pt;font-weight:700;min-width:18mm}

  /* sentence strips */
  .strip{border:1.5px dashed #9aa3b2;border-radius:4mm;padding:3mm;margin-bottom:5mm;display:flex;flex-wrap:nowrap;gap:2mm;align-items:stretch}
  .slot{flex:1 1 0;border:3px solid;border-radius:3mm;min-height:24mm;display:flex;flex-direction:column;justify-content:flex-end;padding:1.5mm 2mm;position:relative}
  .slot .lab{font-size:8pt;font-weight:900;text-transform:uppercase}
  .slot img{position:absolute;top:1.5mm;left:2mm;height:7mm;border-radius:3px;padding:.8mm}
  .slot.opt{border-style:dotted}
  .slot.narrow{flex:0 0 14mm;align-items:center;justify-content:center;border-color:var(--ink);color:var(--ink);font-size:22pt;font-weight:900}
  .slot.join{flex:0 0 26mm;border-color:#c0392b;color:#c0392b}
  .slot.sub{flex:0 0 26mm;border-color:#2e5fa3;color:#2e5fa3}

  /* fix-it sheet */
  .fix-top{display:flex;gap:6mm;align-items:center}
  .fix-top img{width:60mm;border-radius:8px}
  .fix-item{margin:4mm 0 0;page-break-inside:avoid;break-inside:avoid}
  .fix-item .q{font-family:'Andika',sans-serif;font-size:14pt}
  .fix-item .kind{font-size:9pt;font-weight:900;color:var(--brand);text-transform:uppercase}
  .fix-item .lines{border-bottom:1.5px solid #b9c1ce;height:11mm}
  .answers li{font-family:'Andika',sans-serif;font-size:12pt;margin-bottom:2mm}

  @media print{
    body{background:#fff}
    .controls,.hint{display:none!important}
    .sheet{margin:0;box-shadow:none;page-break-after:always;break-after:page}
    .sheet:last-child{page-break-after:auto;break-after:auto}
  }
  @page{margin:0}
</style>
<style id="pageSize">@page{size:A4 portrait}</style>
</head>
<body>
<div class="controls">
  <b>🖨️ Sentence Builder printables</b>
  <label>Resource
    <select id="kind">
      <option value="mat">Desk mat (sentence ladder)</option>
      <option value="cards">Picture word cards</option>
      <option value="strips">Sentence strips</option>
      <option value="fix">Fix it sheet</option>
    </select>
  </label>
  <label id="picWrap">Picture <select id="pic"></select></label>
  <label id="stepWrap">Step
    <select id="step">
      <option value="1">Step 1: who + doing</option>
      <option value="2">Step 2: + what / where</option>
      <option value="3">Step 3: + extras</option>
      <option value="4">Step 4: joining two ideas</option>
      <option value="6">Step 6: fronted adverbial</option>
      <option value="7">Step 7: relative clause</option>
    </select>
  </label>
  <label id="fixWrap">Sentences
    <select id="fixType">
      <option value="mix">A mix</option>
      <option value="runon">Run-on sentences</option>
      <option value="comma">Comma splices</option>
      <option value="nocomma">Missing commas</option>
      <option value="and">And… and… and…</option>
      <option value="extras">Too many extras</option>
    </select>
  </label>
  <button id="again" title="Make new sentences">🔄 New sentences</button>
  <button class="primary" id="printBtn">🖨️ Print</button>
  <span class="ver">Version <span id="ver"></span></span>
</div>
<p class="hint" id="hint"></p>
<div id="out"></div>

<script src="content.js?v=10.10.26g"></script>
<script src="topics/stories-more.js?v=10.10.26g"></script>
<script src="topics/settings.js?v=10.10.26g"></script>
<script src="topics/characters.js?v=10.10.26g"></script>
<script src="topics/history-more.js?v=10.10.26g"></script>
<script src="topics/science.js?v=10.10.26g"></script>
<script src="topics/geography.js?v=10.10.26g"></script>
<script src="topics/scigeo-more.js?v=10.10.26g"></script>
<script src="topics/history-more2.js?v=10.10.26g"></script>
<script src="topics/everyday.js?v=10.10.26g"></script>
<script src="engine.js?v=10.10.26g"></script>
<script>
const VERSION = '10.10.26g';
const $ = q => document.querySelector(q);
const ICON = k => `icons/${k}.png`;
const LAB = {who:'who', doing:'doing', what:'what', where:'where', when:'when', how:'how', describe:'describe'};
const blk = (cat, t) => `<span class="blk ${cat}">${esc(t)}</span>`;
const foot = extra => `<div class="foot"><span>Wallscourt Farm Academy · Sentence Builder</span><span>${extra || ''} Version ${VERSION}</span></div>`;

// picture picker
const picSel = $('#pic');
TOPICS.forEach(t => {
  const g = document.createElement('optgroup'); g.label = `${t.label} (${t.years})`;
  t.pictures.forEach(p => { const o = document.createElement('option'); o.value = `${t.id}.${p.id}`; o.textContent = p.title; g.appendChild(o); });
  picSel.appendChild(g);
});
const getPic = () => { const [tid, pid] = picSel.value.split('.'); return TOPICS.find(t => t.id === tid).pictures.find(p => p.id === pid); };

/* ---------- desk mat ---------- */
function mat(){
  const rungs = [
    [1, 'Who + doing', [['who','The astronaut'],['doing','floats']]],
    [2, '+ what or where', [['who','The astronaut'],['doing','holds'],['what','an apple']]],
    [3, '+ extras (not too many!)', [['lit','The'],['describe','happy'],['who','astronaut'],['doing','floats'],['how','slowly']]],
    [4, 'Join two ideas: and · but · so', [['who','The rocket'],['doing','blasts off'],['join','so'],['who','the crowd'],['doing','cheers']]],
    [5, 'Join two ideas: because · when · if', [['who','The crowd'],['doing','cheers'],['sub','because'],['who','the rocket'],['doing','blasts off']]],
    [6, 'Fronted adverbial + comma', [['when','After lunch'],['lit',','],['who','the astronaut'],['doing','eats'],['what','an apple']]],
    [7, 'Extra information about the who', [['who','The astronaut'],['lit',','],['sub','who'],['doing','smiles'],['lit',','],['doing','floats']]]
  ];
  const r = rungs.map(([n, t, ex]) => `<div class="rung"><div class="n">${n}</div><div><div class="t">${esc(t)}</div><div class="ex">${ex.map(([c, w]) => blk(c, w)).join('')}<span class="blk lit">.</span></div></div></div>`).join('');
  const key = Object.keys(LAB).map(k => `<div><img src="${ICON(k)}" class="${k}" alt="">${LAB[k]}</div>`).join('');
  return `<div class="sheet landscape"><h1>My sentence ladder</h1>
    <div class="mat"><div class="ladder">${r}</div><div>
      <div class="box"><h2>✅ Before I finish</h2><ul>
        <li>Is there a <b>who</b> and a <b>doing</b>?</li>
        <li>Read it aloud. <b>Does it make sense?</b></li>
        <li><b>One idea → one full stop.</b></li>
        <li>Two ideas? Use a <b>full stop</b> or a <b>joining word</b>.</li>
        <li>A comma <b>cannot</b> join two ideas on its own.</li>
        <li>Not too many extras. Take them away: does the core still make sense?</li>
        <li>Capital letter at the start, full stop at the end.</li>
      </ul></div>
      <div class="box"><h2>🎨 Colour key</h2><div class="key">${key}</div></div>
    </div></div>${foot()}</div>`;
}

/* ---------- picture word cards ---------- */
function cards(){
  const p = getPic();
  const group = (cat, list) => list.length ? `<h2><img src="${ICON(cat)}" class="${cat}" style="height:6mm;border-radius:3px;padding:.6mm;vertical-align:middle"> ${LAB[cat]}</h2><div class="cards">${
    list.map(c => `<div class="cut"><span class="blk ${cat}">${esc(cat === 'who' ? np(c) : c.t)}<small>${LAB[cat]}</small></span></div>`).join('')}</div>` : '';
  const punct = ['.', ',', ',', '(', ')'].map(x => `<div class="cut"><span class="blk punct">${x}</span></div>`).join('')
    + ['and','but','so'].map(x => `<div class="cut"><span class="blk join">${x}<small>joining word</small></span></div>`).join('')
    + ['because','when','if','who','which'].map(x => `<div class="cut"><span class="blk sub">${x}<small>joining word</small></span></div>`).join('');
  return `<div class="sheet portrait">
    <div class="wc-top"><img src="${p.img}" alt=""><div><h1>${esc(p.title)}</h1><p>Cut out the cards. Build the core first: <b>who + doing</b>. Read it aloud. Does it make sense? Then add a what or a where, and only then an extra or two.</p></div></div>
    ${group('who', p.who)}${group('doing', p.doing)}${group('what', p.what)}${group('where', p.where)}${foot(p.title + ' · page 1 ·')}</div>
    <div class="sheet portrait"><h1>${esc(p.title)}: extras and joining words</h1>
    ${group('describe', p.describe)}${group('how', p.how)}${group('when', p.when)}
    <h2>Full stops, commas, brackets and joining words</h2><div class="cards">${punct}</div>${foot(p.title + ' · page 2 ·')}</div>`;
}

/* ---------- sentence strips ---------- */
function strips(){
  const n = +$('#step').value;
  const slot = (cat, opt) => `<div class="slot ${opt ? 'opt' : ''}" style="border-color:var(--${cat});color:var(--${cat})"><img src="${ICON(cat)}" class="${cat}" alt=""><span class="lab">${LAB[cat]}</span></div>`;
  const mark = t => `<div class="slot narrow">${t}</div>`;
  const join = (cls, t) => `<div class="slot ${cls}"><span class="lab">${t}</span></div>`;
  const core = ['who','doing'].map(c => slot(c)).join('') + (n > 1 ? slot('what', true) + slot('where', true) : '');
  const layouts = {
    1: slot('who') + slot('doing') + mark('.'),
    2: core + mark('.'),
    3: slot('describe', true) + slot('who') + slot('doing') + slot('what', true) + slot('how', true) + slot('where', true) + slot('when', true) + mark('.'),
    4: slot('who') + slot('doing') + slot('where', true) + join('join', 'and · but · so') + slot('who') + slot('doing') + slot('where', true) + mark('.'),
    6: slot('when') + mark(',') + slot('who') + slot('doing') + slot('what', true) + slot('where', true) + mark('.'),
    7: slot('who') + mark(',') + join('sub', 'who · which') + slot('doing') + slot('what', true) + mark(',') + slot('doing') + slot('where', true) + mark('.')
  };
  const names = {1:'Step 1: who + doing', 2:'Step 2: who + doing + what or where', 3:'Step 3: core + up to 2 extras (dotted = optional)', 4:'Step 4: two ideas joined', 6:'Step 6: fronted adverbial + comma (when, where or how)', 7:'Step 7: extra information about the who, inside two commas'};
  const rows = Array.from({length:4}, () => `<div class="strip">${layouts[n]}</div>`).join('');
  return `<div class="sheet landscape"><h1>Sentence strips · ${esc(names[n])}</h1>
    <p style="margin:0 0 4mm;color:var(--muted);font-weight:700">Cut out a strip. Put word cards (or write words) in the boxes. Solid boxes are needed; dotted boxes are optional.</p>
    ${rows}${foot()}</div>`;
}

/* ---------- fix it sheet ---------- */
let fixCache = null;
// lower-case a clause's first letter, unless it starts with a name ("King Henry")
const lowFor = (st, x) => st.who.det ? x.charAt(0).toLowerCase() + x.slice(1) : x;
function makeFixItems(p, type){
  const types = type === 'mix' ? ['runon','comma','nocomma','and','extras','runon','nocomma','comma'] : Array(8).fill(type);
  return types.map(ty => {
    if (ty === 'runon' || ty === 'comma'){
      const a = genClause(p), b = genClause(p, [a.who.id]);
      const A = textOf(parts(a)).text, B = textOf(parts(b)).text;
      return {ty, q: A + (ty === 'comma' ? ', ' : ' ') + lowFor(b, B) + '.', a: A + '. ' + B + '.'};
    }
    if (ty === 'nocomma'){
      const g = genFronted(p);
      const core = textOf(parts(g.clause)).text;
      const f = cap(g.front.card.t);
      return {ty, q: `${f} ${lowFor(g.clause, core)}.`, a: `${f}, ${lowFor(g.clause, core)}.`};
    }
    if (ty === 'and'){
      const cs = [], used = [], seen = new Set();
      for (let i = 0, tries = 0; i < 3 && tries < 300; tries++){
        const c = genClause(p, used.length < p.who.length ? used : null);
        const k = c.who.id + c.doing.id; if (seen.has(k)) continue; seen.add(k); cs.push(c); used.push(c.who.id); i++;
      }
      const t = cs.map(c => textOf(parts(c)).text);
      return {ty, q: t[0] + ' and ' + lowFor(cs[1], t[1]) + ' and ' + lowFor(cs[2], t[2]) + '.', a: t[0] + ' and ' + lowFor(cs[1], t[1]) + '. ' + t[2] + '.'};
    }
    const st = overloaded(p, 2);
    const core = textOf(parts(st, {core:true})).text;
    return {ty, q: textOf(parts(st)).text + '.', a: `Core: ${core}. Keep no more than two extras, never two how words together.`};
  });
}
const FIX_TIPS = {
  runon:'Two ideas, no full stop. Find where the second idea starts.',
  comma:'A comma cannot join two ideas. Fix it.',
  nocomma:'The fronted adverbial needs a comma after it.',
  and:'Too many ands! No more than two ideas in a sentence.',
  extras:'Too many extras. Cross some out so it makes sense.'
};
function fix(){
  const p = getPic(), type = $('#fixType').value;
  const key = p.id + type;
  if (!fixCache || fixCache.key !== key) fixCache = {key, items: makeFixItems(p, type)};
  const items = fixCache.items;
  const list = items.map((it, i) => `<div class="fix-item"><div class="kind">${i + 1}. ${esc(FIX_TIPS[it.ty])}</div><div class="q">${esc(it.q)}</div><div class="lines"></div></div>`).join('');
  const ans = items.map(it => `<li>${esc(it.a)}</li>`).join('');
  return `<div class="sheet portrait"><div class="fix-top"><img src="${p.img}" alt=""><div><h1>Fix it! ${esc(p.title)}</h1>
    <p style="font-weight:700;color:var(--muted)">Read each sentence aloud. Does it make sense? Fix it, then write the fixed sentence on the lines.</p></div></div>
    ${list}${foot()}</div>
    <div class="sheet portrait"><h1>Fix it! Answers (one good fix for each)</h1><p style="color:var(--muted);font-weight:700">Other fixes may also be right, e.g. <i>and</i>, <i>but</i> or <i>so</i> instead of a full stop.</p><ol class="answers">${ans}</ol>${foot('Teacher copy ·')}</div>`;
}

/* ---------- render ---------- */
function render(){
  const k = $('#kind').value;
  $('#picWrap').hidden = !(k === 'cards' || k === 'fix');
  $('#stepWrap').hidden = k !== 'strips';
  $('#fixWrap').hidden = k !== 'fix';
  $('#again').hidden = k !== 'fix';
  const landscape = k === 'mat' || k === 'strips';
  $('#pageSize').textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:0}`;
  $('#hint').textContent = {
    mat:'One A4 landscape page: the 7-step ladder, a "before I finish" checklist and the colour key. Laminate for desks.',
    cards:'Two A4 pages: the picture with its who / doing / what / where cards, then extras, punctuation and joining-word cards to cut out.',
    strips:'One A4 landscape page of 4 strips for the chosen step. Use with the word cards or for writing.',
    fix:'Two A4 pages: 8 sentences made from the picture\'s word cards to fix, then a teacher answer page. "New sentences" makes a fresh set.'
  }[k];
  $('#out').innerHTML = k === 'mat' ? mat() : k === 'cards' ? cards() : k === 'strips' ? strips() : fix();
}
$('#ver').textContent = VERSION;
// ?kind=cards&pic=space.station&step=2&fix=runon opens a resource directly
(function(){
  const q = new URLSearchParams(location.search);
  if (q.get('kind')) $('#kind').value = q.get('kind');
  if (q.get('pic')) picSel.value = q.get('pic');
  if (q.get('step')) $('#step').value = q.get('step');
  if (q.get('fix')) $('#fixType').value = q.get('fix');
})();
['kind','pic','step','fixType'].forEach(id => $('#' + id).onchange = render);
$('#again').onclick = () => { fixCache = null; render(); };
$('#printBtn').onclick = () => window.print();
render();
</script>
</body>
</html>
